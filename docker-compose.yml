services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CAE_SQLITE_PATH: /app/jobs/cae.db
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./cae-workspace:/app/jobs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A universal_dispatcher.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CAE_SQLITE_PATH: /app/jobs/cae.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./cae-workspace:/app/jobs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: