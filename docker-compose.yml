services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A universal_dispatcher.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - cae-jobs:/app/jobs
    restart: unless-stopped

    # OpenFOAM can be attached later either by mounting a solver installation:
    # volumes:
    #   - cae-jobs:/app/jobs
    #   - ./solvers/openfoam:/opt/openfoam:ro
    # Or by running an OpenFOAM image in a separate service and invoking it
    # through Docker/OCI APIs from the worker in a later iteration.

    # CalculiX can be attached similarly by mounting a CalculiX image/toolchain:
    # volumes:
    #   - ./solvers/calculix:/opt/calculix:ro

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  cae-jobs:
