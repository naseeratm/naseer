# ==============================================================================
# NASEER Universal CAE Studio — Enterprise Multi-Tenant SaaS Stack
# Includes: FastAPI API + Celery Multi-Physics Worker + Redis + PostgreSQL + MinIO S3
#
# Usage:
#   1. Copy .env.example -> .env and set NASEER_JWT_SECRET, POSTGRES_PASSWORD,
#      MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD.
#   2. Run: docker compose -f docker-compose.enterprise.yml up -d --build
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: naseer_cae_redis_ent
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: naseer_cae_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naseer_cae}
      POSTGRES_USER: ${POSTGRES_USER:-naseer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naseer} -d ${POSTGRES_DB:-naseer_cae}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: naseer_cae_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NASEER_S3_ACCESS_KEY:?Set NASEER_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${NASEER_S3_SECRET_KEY:?Set NASEER_S3_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: naseer_cae_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${NASEER_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${NASEER_S3_SECRET_KEY}
      S3_BUCKET: ${NASEER_S3_BUCKET:-naseer-cae-archives}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$S3_BUCKET\"
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: naseer_cae_api_ent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CAE_WORK_DIR=/shared_jobs
      - CAE_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-naseer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naseer_cae}
      - NASEER_AUTH_MODE=${NASEER_AUTH_MODE:-enforced}
      - NASEER_JWT_SECRET=${NASEER_JWT_SECRET:?Set NASEER_JWT_SECRET in .env}
      - NASEER_ADMIN_PASSCODE=${NASEER_ADMIN_PASSCODE:-}
      - NASEER_ALLOWED_ORIGINS=${NASEER_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - NASEER_S3_ENDPOINT=http://minio:9000
      - NASEER_S3_BUCKET=${NASEER_S3_BUCKET:-naseer-cae-archives}
      - NASEER_S3_REGION=${NASEER_S3_REGION:-us-east-1}
      - NASEER_S3_ACCESS_KEY=${NASEER_S3_ACCESS_KEY}
      - NASEER_S3_SECRET_KEY=${NASEER_S3_SECRET_KEY}
    volumes:
      - shared_jobs:/shared_jobs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: naseer_cae_worker_ent
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CAE_WORK_DIR=/shared_jobs
      - CAE_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-naseer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naseer_cae}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    volumes:
      - shared_jobs:/shared_jobs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  minio_data:
  shared_jobs:
