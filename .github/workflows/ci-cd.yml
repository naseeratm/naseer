name: NASEER CAE Studio CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-verification:
    name: Python Solver, V&V & Enterprise Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic uvicorn httpx numpy scipy sqlalchemy openpyxl trimesh boto3
      - name: Syntax verification (py_compile)
        run: |
          python -m py_compile main.py physics_solver.py universal_dispatcher.py cae_repository.py vv_regression_suite.py enterprise_security.py object_storage.py
      - name: Run full unit test & V&V suite
        run: |
          python -m unittest test_result_schema.py test_solver.py test_global_parity.py test_vv_regression_suite.py test_phase3_nonlinear.py test_phase4_enterprise.py -v

  frontend-build:
    name: TypeScript Lint & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
      - name: TypeScript typecheck
        run: npm run lint
      - name: Production Vite bundle
        run: npm run build

  docker-packaging-check:
    name: Docker API & Script Packaging Verification
    runs-on: ubuntu-latest
    needs: [python-verification, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell & Slurm scripts
        run: |
          bash -n docker-entrypoint-worker.sh
          bash -n deploy/slurm/submit_naseer_job.sbatch
      - name: Build API container image
        run: docker build -f Dockerfile.api -t naseer-cae-api:ci .
