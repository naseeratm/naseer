# ==============================================================================
# NASEER Universal CAE Studio — Kubernetes Cloud & HPC Production Stack
# Includes: Namespace, ConfigMap, Secret template, PVC, Redis, MinIO,
#           FastAPI Deployment+Service, Celery CAE Worker Deployment+HPA, Ingress
#
# Populate secrets before applying:
#   kubectl create secret generic naseer-cae-secrets -n naseer-cae \
#     --from-literal=NASEER_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=NASEER_S3_ACCESS_KEY="<your-access-key>" \
#     --from-literal=NASEER_S3_SECRET_KEY="<your-secret-key>" \
#     --from-literal=CAE_DATABASE_URL="postgresql+psycopg://user:pass@postgres:5432/naseer"
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: naseer-cae
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: naseer-cae-config
  namespace: naseer-cae
data:
  REDIS_URL: "redis://naseer-redis:6379/0"
  CAE_WORK_DIR: "/shared_jobs"
  NASEER_AUTH_MODE: "enforced"
  NASEER_ALLOWED_ORIGINS: "https://cae.example.com"
  NASEER_S3_ENDPOINT: "http://naseer-minio:9000"
  NASEER_S3_BUCKET: "naseer-cae-archives"
  NASEER_S3_REGION: "us-east-1"
  OMP_NUM_THREADS: "4"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naseer-shared-jobs-pvc
  namespace: naseer-cae
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naseer-redis
  namespace: naseer-cae
spec:
  replicas: 1
  selector:
    matchLabels:
      app: naseer-redis
  template:
    metadata:
      labels:
        app: naseer-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: naseer-redis
  namespace: naseer-cae
spec:
  selector:
    app: naseer-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: naseer-minio
  namespace: naseer-cae
spec:
  serviceName: naseer-minio
  replicas: 1
  selector:
    matchLabels:
      app: naseer-minio
  template:
    metadata:
      labels:
        app: naseer-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: naseer-cae-secrets
                  key: NASEER_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naseer-cae-secrets
                  key: NASEER_S3_SECRET_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: naseer-minio
  namespace: naseer-cae
spec:
  selector:
    app: naseer-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naseer-cae-api
  namespace: naseer-cae
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naseer-cae-api
  template:
    metadata:
      labels:
        app: naseer-cae-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/naseer-cae-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: naseer-cae-config
            - secretRef:
                name: naseer-cae-secrets
          volumeMounts:
            - name: shared-jobs
              mountPath: /shared_jobs
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: shared-jobs
          persistentVolumeClaim:
            claimName: naseer-shared-jobs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: naseer-cae-api
  namespace: naseer-cae
spec:
  selector:
    app: naseer-cae-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naseer-cae-worker
  namespace: naseer-cae
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naseer-cae-worker
  template:
    metadata:
      labels:
        app: naseer-cae-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/naseer-cae-worker:latest
          envFrom:
            - configMapRef:
                name: naseer-cae-config
            - secretRef:
                name: naseer-cae-secrets
          volumeMounts:
            - name: shared-jobs
              mountPath: /shared_jobs
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
      volumes:
        - name: shared-jobs
          persistentVolumeClaim:
            claimName: naseer-shared-jobs-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: naseer-cae-worker-hpa
  namespace: naseer-cae
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: naseer-cae-worker
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naseer-cae-ingress
  namespace: naseer-cae
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  rules:
    - host: cae.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: naseer-cae-api
                port:
                  number: 8000
